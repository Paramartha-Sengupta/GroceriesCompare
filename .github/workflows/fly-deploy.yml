name: Deploy to Fly.io (Chennai)
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/fly-deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create Fly app if not exists
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl apps create gc-paramartha 2>&1 && echo "App created" || echo "App may already exist, continuing..."

      - name: Deploy to Fly.io Chennai
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false --app gc-paramartha
